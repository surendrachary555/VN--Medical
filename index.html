<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="VN Medical medicine search and availability">
<title>VN Medical — Medicine Search</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f8fb;color:#172033}
header{background:#fff;border-bottom:1px solid #e7ebf0;position:sticky;top:0;z-index:10}.nav{max-width:1100px;margin:auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:24px;font-weight:800}.brand span{color:#1d73e8}.badge{font-size:12px;background:#eaf3ff;color:#1767c4;padding:7px 10px;border-radius:20px}
.hero{background:linear-gradient(135deg,#eaf4ff,#fff);padding:55px 20px 45px;text-align:center}.hero h1{margin:0 0 12px;font-size:42px}.hero p{color:#596579;font-size:17px;margin:0 auto 25px;max-width:650px}
.search{max-width:760px;margin:auto;display:flex;background:#fff;border:1px solid #dce3ec;border-radius:14px;padding:7px;box-shadow:0 8px 25px rgba(30,50,80,.08)}.search input{flex:1;border:0;outline:0;padding:15px;font-size:16px}.search button{border:0;border-radius:10px;padding:0 24px;background:#176fe5;color:#fff;font-weight:700;cursor:pointer}
main{max-width:1100px;margin:auto;padding:30px 20px 60px}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.topline h2{margin:0}#count{color:#697589;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}.card{background:#fff;border:1px solid #e3e8ef;border-radius:16px;padding:20px;box-shadow:0 4px 16px rgba(30,50,80,.04)}.name{font-size:19px;font-weight:800;margin-bottom:8px}.meta{color:#667286;font-size:14px;line-height:1.7}.price{font-size:20px;font-weight:800;margin:14px 0}.status{display:inline-block;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:15px}.in{background:#e7f8ed;color:#16733a}.limited{background:#fff4dc;color:#9a6500}.out{background:#fdeaea;color:#a52c2c}.request{display:block;width:100%;border:0;padding:11px;border-radius:10px;background:#172033;color:#fff;font-weight:700;cursor:pointer;margin-top:8px;text-align:center;text-decoration:none}.empty{text-align:center;padding:45px 20px;color:#697589;background:#fff;border:1px dashed #ccd5e1;border-radius:16px}.error{text-align:center;padding:25px;color:#a52c2c;background:#fff;border:1px solid #f0cccc;border-radius:16px}
footer{background:#172033;color:#dbe2ed;text-align:center;padding:25px 20px;font-size:13px}
@media(max-width:650px){.hero h1{font-size:32px}.search{flex-direction:column;background:transparent;border:0;box-shadow:none;gap:8px}.search input,.search button{min-height:50px;border-radius:10px}.search input{border:1px solid #dce3ec}.search button{padding:12px}}
</style>
</head>
<body>
<header><div class="nav"><div class="brand">VN <span>Medical</span></div><div class="badge">Medicine Search</div></div></header>
<section class="hero"><h1>Find your medicine</h1><p>Search VN Medical's inventory to check medicine details and current availability.</p>
<div class="search"><input id="q" placeholder="Search by medicine name, strength or manufacturer..." autocomplete="off"><button id="searchBtn">Search</button></div></section>
<main><div class="topline"><h2>Medicines</h2><div id="count"></div></div><div id="results" class="grid"><div class="empty">Loading medicines...</div></div></main>
<footer>VN Medical · Medicine availability search</footer>
<script>
const phone="919000000345";
const results=document.getElementById("results"), count=document.getElementById("count"), q=document.getElementById("q");
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function cls(s){const x=String(s||"").toLowerCase();return x.includes("out")?"out":x.includes("limited")?"limited":"in"}
function request(n){const msg=encodeURIComponent("Hello VN Medical, I would like to check/request: "+n);location.href="https://wa.me/"+phone+"?text="+msg}
async function render(){
  const term=q.value.trim();
  results.innerHTML='<div class="empty">Loading medicines...</div>';
  try{
    const response=await fetch("/api/medicines?search="+encodeURIComponent(term),{cache:"no-store"});
    if(!response.ok) throw new Error("API "+response.status);
    const a=await response.json();
    count.textContent=a.length+" result"+(a.length===1?"":"s");
    if(!a.length){results.innerHTML='<div class="empty">No matching medicine found.</div>';return}
    results.innerHTML=a.map(m=>`<article class="card">
      <div class="name">${esc(m.name)}</div>
      <div class="status ${cls(m.availability)}">${esc(m.availability)}</div>
      <div class="meta"><b>Strength:</b> ${esc(m.strength)}<br>
      <b>Manufacturer:</b> ${esc(m.manufacturer)}<br>
      <b>Quantity:</b> ${esc(m.quantity)}<br>
      <b>Prescription:</b> ${esc(m.prescription_required)}</div>
      <div class="price">₹${Number(m.price||0).toFixed(2)}</div>
      <button class="request" onclick="request('${esc(m.name)}')">WhatsApp Request</button>
      <a class="request" href="tel:+919000000345">Call 9000000345</a>
    </article>`).join("");
  }catch(e){
    count.textContent="";
    results.innerHTML='<div class="error">The live medicine service is not connected yet. Your previous website remains available while we finish the deployment.</div>';
  }
}
document.getElementById("searchBtn").addEventListener("click",render);
q.addEventListener("input",render);
render();
</script>
</body>
</html>
